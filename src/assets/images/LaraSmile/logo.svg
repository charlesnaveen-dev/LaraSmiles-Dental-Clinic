<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%">
  <defs>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D3CC8" />
      <stop offset="100%" stop-color="#4A2391" />
    </linearGradient>
  </defs>

  <!-- Tooth Icon -->
  <g transform="translate(10, 15)">
    <path d="M35 5 C22 5, 8 18, 8 36 C8 58, 18 72, 22 92 C24 102, 29 104, 34 94 C38 86, 42 86, 46 94 C51 104, 56 102, 58 92 C62 72, 72 58, 72 36 C72 18, 58 5, 45 5 Z" 
          fill="none" stroke="url(#toothGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Smile swoop inside tooth -->
    <path d="M22 42 Q40 62 58 42" fill="none" stroke="#6D3CC8" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- LARA Text -->
  <text x="100" y="68" font-family="'Outfit', 'Arial Black', sans-serif" font-size="48" font-weight="800" fill="url(#textGrad)" letter-spacing="1">LARA</text>
  
  <!-- Smiles Text -->
  <text x="245" y="68" font-family="'Georgia', 'Times New Roman', serif" font-size="46" font-weight="700" font-style="italic" fill="#6D3CC8">Smiles</text>
  <text x="395" y="40" font-family="sans-serif" font-size="14" font-weight="700" fill="#6D3CC8">®</text>

  <!-- Smile Swoosh Line under LARA Smiles -->
  <path d="M105 80 Q250 115 395 80" fill="none" stroke="#6D3CC8" stroke-width="4.5" stroke-linecap="round" />

  <!-- Tagline -->
  <text x="240" y="110" font-family="'Georgia', 'Brush Script MT', serif" font-size="18" font-style="italic" fill="#582CA9" text-anchor="middle">Believe in your Smile</text>
</svg>